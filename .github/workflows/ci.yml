name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "site/**"
      - "Tests/Site/**"
      - "scripts/build-site.ps1"
      - "scripts/check-site.ps1"
      - "scripts/SiteBuild.psm1"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "Tests/Site/**"
      - "scripts/build-site.ps1"
      - "scripts/check-site.ps1"
      - "scripts/SiteBuild.psm1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The pruning ledger check evaluates the test projects' Compile items. The adopted formatter check
      # selects the pinned 10.0.401 SDK through its own scratch global.json; nothing else uses it.
      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            10.0.401

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # The only download step; the policy check below then validates the pins and downloads nothing.
      - name: Install pinned formatter tools
        shell: pwsh
        run: ./scripts/format/install-format-tools.ps1

      - name: Verify repository policy
        shell: pwsh
        run: ./scripts/verify.ps1 -PolicyOnly

  build-test:
    name: ${{ matrix.name }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: Linux x64
            os: ubuntu-24.04
            rid: linux-x64
          - name: macOS Apple Silicon
            os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies and run NuGet audit
        run: |
          dotnet restore HappyPhoton.sln --locked-mode -p:ContinuousIntegrationBuild=true
          dotnet restore HappyPhoton.csproj --locked-mode -p:RuntimeIdentifier=${{ matrix.rid }} -p:PublishReadyToRun=true -p:ContinuousIntegrationBuild=true

      - name: Build
        run: >
          dotnet build HappyPhoton.sln
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Verify repository
        shell: pwsh
        run: |
          # Discovery (one in-process manifest per test project with count minima and
          # quarantine registry validation), the solution tests, and the manifest-to-TRX
          # reconciliation all run inside verify.ps1 on every platform. The build step
          # above is the only build; the checker never builds.
          $verifyArguments = @{
            Configuration = "Release"
            NoBuild = $true
            NoRestore = $true
            SkipPolicy = $true
            BlameHang = $true
            BlameHangTimeout = "90s"
            LogFilePrefix = "happy-photon-${{ matrix.rid }}"
            ResultsDirectory = "artifacts/test-results/${{ matrix.rid }}"
            # The 16 GB Windows runner stalls when both test hosts run at once (FIXES-WP8).
            SerialProjects = "${{ matrix.rid }}" -eq "win-x64"
            # Hosted runners keep two processors and one headless host; the runsettings cap of
            # eight and the four headless shards are for local runs.
            ProcessorCount = 2
            HeadlessShards = 1
          }
          ./scripts/verify.ps1 @verifyArguments

      - name: Resolve source identity
        id: source-identity
        shell: pwsh
        run: |
          $sourceRevision = (git rev-parse HEAD).Trim()
          $commitTimestamp = (git show -s --format=%cI HEAD).Trim()
          $buildTimestamp = [DateTimeOffset]::Parse($commitTimestamp).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "source-revision=$sourceRevision" >> $env:GITHUB_OUTPUT
          "build-timestamp=$buildTimestamp" >> $env:GITHUB_OUTPUT

      # Release order: the MSIX is built before the single-file publish (release.yml).
      - name: Build Store MSIX
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # MSIX takes a final x.y.z version; CI packages use the project version's core.
          $version = ((dotnet msbuild HappyPhoton.csproj -nologo -getProperty:Version).Trim() -split '-')[0]
          ./scripts/package-windows-msix.ps1 `
            -Version $version `
            -SourceRevision ${{ steps.source-identity.outputs.source-revision }} `
            -BuildTimestampUtc ${{ steps.source-identity.outputs.build-timestamp }} `
            -ContinuousIntegrationBuild `
            -NoRestore

      - name: Publish platform build
        run: >
          dotnet publish HappyPhoton.csproj
          -p:PublishProfile=${{ matrix.rid }}
          -p:SourceRevisionId=${{ steps.source-identity.outputs.source-revision }}
          -p:SourceRevision=${{ steps.source-identity.outputs.source-revision }}
          -p:BuildTimestampUtc=${{ steps.source-identity.outputs.build-timestamp }}
          --no-restore
          --output artifacts/ci/${{ matrix.rid }}
          -p:ContinuousIntegrationBuild=true

      - name: Verify Apple Silicon LibRaw runtime
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          for runtime in artifacts/ci/osx-arm64/libraw.25.dylib artifacts/ci/osx-arm64/libhappyphoton_libraw_bridge.dylib; do
            test -f "$runtime"
            file "$runtime" | grep -q 'arm64'
          done
          otool -D artifacts/ci/osx-arm64/libraw.25.dylib | grep -q '@loader_path/libraw.25.dylib'
          otool -L artifacts/ci/osx-arm64/libhappyphoton_libraw_bridge.dylib | grep -q '@loader_path/libraw.25.dylib'

      # Release-layout archives, built as release.yml builds them, so package size is
      # tracked on every change.
      - name: Build release-layout archive
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $publish = "artifacts/ci/$rid"
          $sizes = [ordered]@{}

          $version = (dotnet msbuild HappyPhoton.csproj -nologo -getProperty:Version).Trim()
          $manifest = if ($rid -eq 'osx-arm64') { "$env:RUNNER_TEMP/DEPENDENCIES.json" } else { "$publish/DEPENDENCIES.json" }
          ./scripts/write-dependency-manifest.ps1 -OutputPath $manifest -Version $version -RuntimeIdentifier $rid

          switch ($rid) {
            'win-x64' {
              Compress-Archive -Path "$publish/*" -DestinationPath artifacts/ci/package.zip -CompressionLevel Optimal
              $sizes['Windows ZIP'] = (Get-Item artifacts/ci/package.zip).Length
              $sizes['Store MSIX'] = (Get-Item artifacts/windows-msix/package/*.msix).Length
            }
            'linux-x64' {
              chmod +x "$publish/HappyPhoton"
              $epoch = git log -1 --format=%ct
              bash -c "tar --sort=name --mtime=@$epoch --owner=0 --group=0 --numeric-owner -C '$publish' -cf - . | gzip -n > artifacts/ci/package.tar.gz"
              $sizes['Linux tarball'] = (Get-Item artifacts/ci/package.tar.gz).Length
            }
            'osx-arm64' {
              $env:APPLE_SIGNING_IDENTITY = '-'
              $env:HAPPY_PHOTON_CI_BUILD = '1'
              $env:HAPPY_PHOTON_NO_RESTORE = '1'
              $env:HAPPY_PHOTON_DEPENDENCY_MANIFEST = $manifest
              $env:HAPPY_PHOTON_SOURCE_REVISION = '${{ steps.source-identity.outputs.source-revision }}'
              $env:HAPPY_PHOTON_BUILD_TIMESTAMP = '${{ steps.source-identity.outputs.build-timestamp }}'
              ./scripts/package-macos.sh arm64
              if ($LASTEXITCODE) { throw 'package-macos.sh failed' }
              ditto -c -k --sequesterRsrc --keepParent 'artifacts/osx-arm64/Happy Photon.app' artifacts/ci/package.zip
              $sizes['macOS zip'] = (Get-Item artifacts/ci/package.zip).Length
            }
          }

          foreach ($entry in $sizes.GetEnumerator()) {
            $line = "PACKAGE-SIZE $($entry.Key): $($entry.Value) bytes"
            Write-Output $line
            $line | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/${{ matrix.rid }}
          if-no-files-found: warn
          retention-days: 1

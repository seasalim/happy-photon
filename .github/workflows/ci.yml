name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-pixels:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
        revision: [73d631ce9fbb24924a066db211fd1075207de692, 1191d2d1e2186c33823596bc3eb02cb39cf7ad40, ac89bc67a2618d2bb2eb6704426b0b400852c2d4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install historical measurement probes
        shell: pwsh
        run: |
          Copy-Item harness/Tests/PlatformProbe/RenderSequenceGoldenTests.cs.txt source/Tests/RenderSequenceGoldenTests.cs
          if ('${{ matrix.revision }}' -ne '73d631ce9fbb24924a066db211fd1075207de692') {
            Copy-Item harness/Tests/PlatformProbe/LocalsLinearParitySentinelTests.cs.txt source/Tests/LocalsLinearParitySentinelTests.cs
          }
          git -C source rev-parse HEAD
      - name: Measure historical pixels
        shell: pwsh
        working-directory: source
        run: |
          dotnet test Tests/HappyPhoton.Tests.csproj --configuration Release -p:ContinuousIntegrationBuild=true --filter 'FullyQualifiedName~PixelsAndStagesMatchFrozenBase|FullyQualifiedName~ActiveLinearPixelsStayByteIdentical' --logger 'trx;LogFileName=pixels.trx' --results-directory artifacts/pixel-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pixels-${{ matrix.os }}-${{ matrix.revision }}
          path: source/artifacts/pixel-probe
          if-no-files-found: error
          retention-days: 14

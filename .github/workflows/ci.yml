name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "site/**"
      - "Tests/Site/**"
      - "scripts/build-site.ps1"
      - "scripts/check-site.ps1"
      - "scripts/SiteBuild.psm1"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "Tests/Site/**"
      - "scripts/build-site.ps1"
      - "scripts/check-site.ps1"
      - "scripts/SiteBuild.psm1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
          - name: macOS Apple Silicon
            os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check source file lengths
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: ./scripts/check-source-lines.ps1

      - name: Restore locked dependencies and run NuGet audit
        run: |
          dotnet restore HappyPhoton.sln --locked-mode -p:ContinuousIntegrationBuild=true
          dotnet restore HappyPhoton.csproj --locked-mode -p:RuntimeIdentifier=${{ matrix.rid }} -p:PublishReadyToRun=true -p:ContinuousIntegrationBuild=true

      - name: Build
        run: >
          dotnet build HappyPhoton.sln
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Verify test discovery
        shell: pwsh
        run: |
          function Get-DiscoveredTestCount {
            param([string] $Project)

            $output = dotnet test $Project `
              --configuration Release `
              --no-build `
              --no-restore `
              --list-tests 2>&1
            if ($LASTEXITCODE -ne 0) {
              $output | ForEach-Object { Write-Host $_ }
              throw "Test discovery failed for $Project."
            }

            return @($output | Where-Object {
                $_ -match '^\s+HappyPhoton\.Tests\.'
              }).Count
          }

          $nativeCount = Get-DiscoveredTestCount `
            "Tests/HappyPhoton.Tests.csproj"
          $headlessCount = Get-DiscoveredTestCount `
            "HeadlessTests/HappyPhoton.Headless.Tests.csproj"
          $totalCount = $nativeCount + $headlessCount

          Write-Host "Discovered $nativeCount native and $headlessCount headless tests ($totalCount total)."
          # Catch missing test assemblies or discovery regressions without failing when tests are added.
          if ($nativeCount -lt 666 -or $headlessCount -lt 35) {
            throw "Test discovery fell below the expected minimum (666 native, 35 headless)."
          }

      - name: Validate test quarantine
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: ./scripts/check-test-quarantine.ps1 -NoBuild -NoRestore

      - name: Test
        run: >
          dotnet test HappyPhoton.sln
          --configuration Release
          --no-build
          --blame-hang
          --blame-hang-timeout 90s
          --logger "trx;LogFilePrefix=happy-photon-${{ matrix.rid }}"
          --results-directory artifacts/test-results/${{ matrix.rid }}

      - name: Resolve source identity
        id: source-identity
        shell: pwsh
        run: |
          $sourceRevision = (git rev-parse HEAD).Trim()
          $commitTimestamp = (git show -s --format=%cI HEAD).Trim()
          $buildTimestamp = [DateTimeOffset]::Parse($commitTimestamp).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "source-revision=$sourceRevision" >> $env:GITHUB_OUTPUT
          "build-timestamp=$buildTimestamp" >> $env:GITHUB_OUTPUT

      - name: Publish platform build
        run: >
          dotnet publish HappyPhoton.csproj
          -p:PublishProfile=${{ matrix.rid }}
          -p:SourceRevisionId=${{ steps.source-identity.outputs.source-revision }}
          -p:SourceRevision=${{ steps.source-identity.outputs.source-revision }}
          -p:BuildTimestampUtc=${{ steps.source-identity.outputs.build-timestamp }}
          --no-restore
          --output artifacts/ci/${{ matrix.rid }}
          -p:ContinuousIntegrationBuild=true

      - name: Verify Apple Silicon LibRaw runtime
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          for runtime in artifacts/ci/osx-arm64/libraw.25.dylib artifacts/ci/osx-arm64/libhappyphoton_libraw_bridge.dylib; do
            test -f "$runtime"
            file "$runtime" | grep -q 'arm64'
          done
          otool -D artifacts/ci/osx-arm64/libraw.25.dylib | grep -q '@loader_path/libraw.25.dylib'
          otool -L artifacts/ci/osx-arm64/libhappyphoton_libraw_bridge.dylib | grep -q '@loader_path/libraw.25.dylib'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/${{ matrix.rid }}
          if-no-files-found: warn
          retention-days: 1

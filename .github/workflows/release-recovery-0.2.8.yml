# One-off owner-authorized packaging recovery; app source remains the immutable v0.2.8 commit.
# Exact-commit CI, candidate review, and WACK passed. Owner waived further test gates.
name: Recover 0.2.8 release packaging
on:
  push:
    branches:
      - release/0.2.8-packaging
concurrency:
  group: release-v0.2.8
  cancel-in-progress: false
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
jobs:
  prepare:
    name: Validate immutable release source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source-revision: ${{ steps.metadata.outputs.source-revision }}
      build-timestamp: ${{ steps.metadata.outputs.build-timestamp }}
      is-tag: 'true'
      is-prerelease: 'false'
    steps:
      - name: Check out qualified source
        uses: actions/checkout@v6
        with:
          ref: 3cf194799d05bf9409943ab41aa4926cbeafb0f8
          persist-credentials: false
      - name: Resolve immutable release metadata
        id: metadata
        shell: bash
        env:
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          test "$(git rev-parse HEAD)" = "3cf194799d05bf9409943ab41aa4926cbeafb0f8"
          test "${MACOS_SIGNING_ENABLED,,}" = "true"
          echo "version=0.2.8" >> "$GITHUB_OUTPUT"
          echo "source-revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          commit_timestamp="$(git show -s --format=%cI HEAD)"
          echo "build-timestamp=$(date -u -d "$commit_timestamp" '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  macos:
    name: Package macOS Apple Silicon
    needs: prepare
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: 3cf194799d05bf9409943ab41aa4926cbeafb0f8
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies and run NuGet audit
        run: |
          dotnet restore HappyPhoton.sln --locked-mode -p:ContinuousIntegrationBuild=true
          dotnet restore HappyPhoton.csproj --locked-mode -p:RuntimeIdentifier=osx-arm64 -p:PublishReadyToRun=true -p:ContinuousIntegrationBuild=true

      - name: Validate Apple signing configuration
        if: needs.prepare.outputs.is-tag == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          missing=()
          [[ -n "$APPLE_CERTIFICATE" ]] || missing+=("APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64")
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=("APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD")
          [[ -n "$APPLE_SIGNING_IDENTITY" ]] || missing+=("APPLE_DEVELOPER_ID_APPLICATION")
          [[ -n "$APPLE_NOTARY_KEY_ID" ]] || missing+=("APPLE_NOTARY_KEY_ID")
          [[ -n "$APPLE_NOTARY_ISSUER_ID" ]] || missing+=("APPLE_NOTARY_ISSUER_ID")
          [[ -n "$APPLE_NOTARY_KEY" ]] || missing+=("APPLE_NOTARY_KEY_P8_BASE64")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing Apple signing settings: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Import Developer ID certificate
        if: needs.prepare.outputs.is-tag == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/happy-photon-developer-id.p12"
          keychain_path="$RUNNER_TEMP/happy-photon-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Write dependency manifest
        shell: pwsh
        run: >
          ./scripts/write-dependency-manifest.ps1
          -OutputPath ${{ runner.temp }}/DEPENDENCIES.json
          -Version ${{ needs.prepare.outputs.version }}
          -RuntimeIdentifier osx-arm64

      - name: Build and sign app bundle
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          HAPPY_PHOTON_CI_BUILD: "1"
          HAPPY_PHOTON_DEPENDENCY_MANIFEST: ${{ runner.temp }}/DEPENDENCIES.json
          HAPPY_PHOTON_SOURCE_REVISION: ${{ needs.prepare.outputs.source-revision }}
          HAPPY_PHOTON_BUILD_TIMESTAMP: ${{ needs.prepare.outputs.build-timestamp }}
          HAPPY_PHOTON_NO_RESTORE: "1"
          HAPPY_PHOTON_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "${{ needs.prepare.outputs.is-tag }}" != "true" ]]; then
            export APPLE_SIGNING_IDENTITY="-"
          fi
          ./scripts/package-macos.sh arm64

      - name: Smoke test signed app launch
        shell: bash
        run: |
          executable="artifacts/osx-arm64/Happy Photon.app/Contents/MacOS/HappyPhoton"
          log="$RUNNER_TEMP/happy-photon-launch.log"
          "$executable" >"$log" 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            wait "$pid" || status=$?
            echo "::error::Signed macOS app exited during launch smoke test."
            exit "${status:-1}"
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Notarize and staple app
        if: needs.prepare.outputs.is-tag == 'true'
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          app="artifacts/osx-arm64/Happy Photon.app"
          submission="$RUNNER_TEMP/happy-photon-notarization.zip"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY" | base64 -D > "$key_path"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Create macOS ZIP
        shell: bash
        run: |
          app="artifacts/osx-arm64/Happy Photon.app"
          artifact="artifacts/happy-photon-${{ needs.prepare.outputs.version }}-osx-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$artifact"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: package-osx-arm64
          path: artifacts/happy-photon-${{ needs.prepare.outputs.version }}-osx-arm64.zip
          if-no-files-found: error
          retention-days: 1

      - name: Remove Apple signing material
        if: always() && needs.prepare.outputs.is-tag == 'true'
        shell: bash
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/happy-photon-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/happy-photon-developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8 \
            "$RUNNER_TEMP/happy-photon-notarization.zip"

  assemble:
    name: Assemble release
    needs:
      - prepare
      - macos
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: 3cf194799d05bf9409943ab41aa4926cbeafb0f8
          persist-credentials: false

      - name: Download verified tagged Windows and Linux packages
        uses: actions/download-artifact@v8
        with:
          run-id: 36179808969
          github-token: ${{ github.token }}
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Download signed macOS package
        uses: actions/download-artifact@v8
        with:
          name: package-osx-arm64
          path: release

      - name: Generate checksums
        shell: bash
        working-directory: release
        run: sha256sum happy-photon-* > SHA256SUMS.txt

      - name: Attest public release provenance
        if: needs.prepare.outputs.is-tag == 'true' && github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: release/happy-photon-*

      - name: Upload combined dry run
        if: needs.prepare.outputs.is-tag != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: happy-photon-${{ needs.prepare.outputs.version }}-release-dry-run
          path: release
          if-no-files-found: error
          retention-days: 1

      - name: Create draft GitHub Release
        if: needs.prepare.outputs.is-tag == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is-prerelease }}
        run: |
          notes="$(cat docs/release-notes-preamble.md)"
          arguments=(
            "v0.2.8"
            release/happy-photon-*
            release/SHA256SUMS.txt
            --draft
            --verify-tag
            --generate-notes
            --title "Happy Photon v0.2.8"
            --notes "$notes"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"
